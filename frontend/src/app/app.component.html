<div class="layout">
  <aside class="sidebar">
    <div class="marca">
      <h1>ARDESOFT · Kaizen</h1>
      <small>Plataforma modular premium</small>
    </div>
    <nav>
      <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Panel</a>
      <a routerLink="/gimnasio/socios" routerLinkActive="activo">Gimnasio · Socios</a>
      <a routerLink="/gimnasio/planes" routerLinkActive="activo">Gimnasio · Planes</a>
      <a routerLink="/gimnasio/membresias" routerLinkActive="activo">Gimnasio · Membresías</a>
      <a routerLink="/gimnasio/acceso" routerLinkActive="activo">Gimnasio · Accesos</a>
      <a routerLink="/administracion/impactos" routerLinkActive="activo">Administración · Impactos</a>
    </nav>
  </aside>

  <section class="main-shell">
    <header class="topbar">
      <div>
        <strong>Breadcrumb:</strong> {{ breadcrumb }}
      </div>
      <div class="topbar-actions">
        <button>Exportar</button>
        <button class="primario">Nueva acción</button>
      </div>
    </header>

    <main class="contenido">
      <router-outlet></router-outlet>
    </main>
  </section>
</div>
