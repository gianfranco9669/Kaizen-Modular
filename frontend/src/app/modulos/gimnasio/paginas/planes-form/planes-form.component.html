<app-page-header
  breadcrumb="Gimnasio / Planes / Formulario"
  [titulo]="idEdicion ? 'Editar plan' : 'Nuevo plan'"
  descripcion="Configuración comercial del gimnasio"
/>

<section class="panel">
  <div class="alerta error" *ngIf="error">{{ error }}</div>
  <form class="grilla" [formGroup]="formulario" (ngSubmit)="guardar()">
    <label>Nombre<input formControlName="nombre"></label>
    <label>Descripción<input formControlName="descripcion"></label>
    <label>Precio<input type="number" formControlName="precio"></label>
    <label>Duración (días)<input type="number" formControlName="duracionDias"></label>
    <label class="inline"><input type="checkbox" formControlName="permiteAcceso"> Permite acceso</label>
    <div class="acciones-form">
      <a routerLink="/gimnasio/planes">Cancelar</a>
      <button type="submit" [disabled]="guardando">{{ guardando ? 'Guardando...' : 'Guardar' }}</button>
    </div>
  </form>
</section>
