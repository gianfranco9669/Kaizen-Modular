<section class="panel">
  <h2>Socios</h2>
  <form class="grilla" [formGroup]="formulario" (ngSubmit)="crear()">
    <input formControlName="numeroSocio" placeholder="Número de socio">
    <input formControlName="nombre" placeholder="Nombre">
    <input formControlName="apellido" placeholder="Apellido">
    <input formControlName="documento" placeholder="Documento">
    <input formControlName="correo" placeholder="Correo">
    <input formControlName="telefono" placeholder="Teléfono">
    <button type="submit">Guardar socio</button>
  </form>

  <table>
    <thead><tr><th>N°</th><th>Nombre</th><th>Documento</th><th>Contacto</th></tr></thead>
    <tbody>
      <tr *ngFor="let socio of socios">
        <td>{{ socio.numeroSocio }}</td>
        <td>{{ socio.apellido }}, {{ socio.nombre }}</td>
        <td>{{ socio.documento }}</td>
        <td>{{ socio.correo }} · {{ socio.telefono }}</td>
      </tr>
    </tbody>
  </table>
</section>
